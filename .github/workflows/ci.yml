name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.compiler }} / ${{ matrix.config }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        config: [release, asan-ubsan, tsan]
        include:
          - config: release
            cmake_flags: -DCMAKE_BUILD_TYPE=Release
          - config: asan-ubsan
            cmake_flags: -DCMAKE_BUILD_TYPE=Debug -DETD_SANITIZE_ADDRESS=ON
          - config: tsan
            cmake_flags: -DCMAKE_BUILD_TYPE=Debug -DETD_SANITIZE_THREAD=ON
    steps:
      - uses: actions/checkout@v4

      - name: Install clang runtime
        if: matrix.compiler == 'clang++'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-rt-18-dev

      - name: Allow TSan on recent kernels
        if: matrix.config == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DETD_WERROR=ON ${{ matrix.cmake_flags }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test (daemon -> listener over loopback)
        run: scripts/smoke_test.sh build

  static-analysis:
    name: static analysis (cppcheck, clang-tidy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cppcheck clang clang-tidy

      - name: Configure (compile_commands.json)
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability --error-exitcode=1 --inline-suppr \
              --std=c++17 -I include --suppress=missingIncludeSystem --quiet src tools tests

      - name: clang-tidy
        run: clang-tidy -p build --quiet src/*.cpp tools/*.cpp

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install gcovr
        run: pip install gcovr

      - name: Configure and build with --coverage
        run: |
          cmake -S . -B build-cov -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++ \
              -DCMAKE_CXX_FLAGS="--coverage -O0"
          cmake --build build-cov -j"$(nproc)"

      - name: Unit tests and smoke test
        run: |
          ctest --test-dir build-cov --output-on-failure
          scripts/smoke_test.sh build-cov

      - name: Coverage report
        run: |
          mkdir -p site/coverage
          gcovr --config .gcovr.cfg --object-directory build-cov --print-summary \
              --fail-under-line 75 \
              --html-details site/coverage/index.html --json-summary site/coverage/summary.json
          python3 - <<'PY'
          import json
          pct = json.load(open("site/coverage/summary.json"))["line_percent"]
          color = "brightgreen" if pct >= 90 else "green" if pct >= 80 else "yellow" if pct >= 70 else "red"
          badge = {"schemaVersion": 1, "label": "coverage", "message": f"{pct:.0f}%", "color": color}
          json.dump(badge, open("site/coverage-badge.json", "w"))
          print(badge)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-site
          path: site
          if-no-files-found: error

  docs:
    name: API documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Build docs (warnings are errors)
        run: doxygen Doxyfile

      - uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: build-docs/html
          if-no-files-found: error

  pages:
    name: assemble site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [coverage, docs]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: coverage-site
          path: site

      - uses: actions/download-artifact@v4
        with:
          name: api-docs
          path: site/api

      - name: Add landing page
        run: cp docs/index.html site/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: pages
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
